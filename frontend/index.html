function scoreColor(s) {
  if (s >= 80) return "score-a";
  if (s >= 65) return "score-b";
  return "score-c";
}

function scoreGrade(s) {
  if (s >= 80) return "A";
  if (s >= 65) return "B";
  return "C";
}

function DashboardRow(props) {

  return React.createElement("div", { className: "dashboard-row" },
    React.createElement("div", { className: "dash-col" },

function generateHistory(ticker, currentPrice) {
  var days = 90;
  var data = [];
  var price = currentPrice * 0.85;
  var now = new Date();
  for (var i = days; i >= 0; i--) {
    var d = new Date(now);
    d.setDate(d.getDate() - i);
    var change = (Math.random() - 0.48) * 0.04;
    price = price * (1 + change);
    var open = price * (1 + (Math.random() - 0.5) * 0.02);
    var high = Math.max(open, price) * (1 + Math.random() * 0.015);
    var low = Math.min(open, price) * (1 - Math.random() * 0.015);
    var close = price;
    data.push({ time: d.toISOString().slice(0,10), open: open, high: high, low: low, close: close });
  }
  // Snap last candle to current price
  if (data.length > 0) { data[data.length-1].close = currentPrice; }
  return data;
}


function KLineChart(props) {
  var containerRef = React.useRef(null);
  var chartRef = React.useRef(null);
  var seriesRef = React.useRef(null);

  React.useEffect(function() {
    if (!containerRef.current) return;
    if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
    var chart = LightweightCharts.createChart(containerRef.current, {
      width: containerRef.current.clientWidth,
      height: 220,
      layout: { background: { color: "#161b22" }, textColor: "#8b949e" },
      grid: { vertLines: { color: "#21262d" }, horzLines: { color: "#21262d" } },
      crosshair: { mode: 1 },
      rightPriceScale: { borderColor: "#30363d" },
      timeScale: { borderColor: "#30363d", timeVisible: true }
    });
    chartRef.current = chart;
    var series = chart.addCandlestickSeries({
      upColor: "#3fb950", downColor: "#f85149",
      borderUpColor: "#3fb950", borderDownColor: "#f85149",
      wickUpColor: "#3fb950", wickDownColor: "#f85149"
    });
    seriesRef.current = series;
    var history = generateHistory(props.ticker, props.price);
    series.setData(history);
    chart.timeScale().fitContent();
    var ro = new ResizeObserver(function() {
      if (containerRef.current && chartRef.current) {
        chartRef.current.applyOptions({ width: containerRef.current.clientWidth });
      }
    });
    ro.observe(containerRef.current);
    return function() {
      ro.disconnect();
      if (chartRef.current) { chartRef.current.remove(); chartRef.current = null; }
    };
  }, [props.ticker, props.price]);

  return React.createElement("div", { className: "section" },
    React.createElement("h3", { style: { fontSize: "14px", marginBottom: "12px", color: "#58a6ff" } }, "K 线（近 90 日）"),
    React.createElement("div", { ref: containerRef, style: { width: "100%", height: "220px", borderRadius: "6px", overflow: "hidden" } })
  );
}
