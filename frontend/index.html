<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuffettDash - 巴菲特选股仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js" crossorigin></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg-primary:#f8f5ff;
  --bg-secondary:#eeeaff;
  --bg-card:#ffffff;
  --bg-card-hover:#f3efff;
  --border:#e0d8f5;
  --border-light:#c8bce8;
  --text-primary:#2d2640;
  --text-secondary:#6b5f8a;
  --text-muted:#978bb5;
  --accent-pink:#ff4d85;
  --accent-pink-glow:rgba(255,77,133,0.12);
  --accent-cyan:#00bcd4;
  --accent-cyan-glow:rgba(0,188,212,0.1);
  --accent-green:#2ecc71;
  --accent-yellow:#f1c40f;
  --accent-red:#e74c3c;
  --accent-orange:#f39c12;
  --accent-purple:#9b59b6;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
}
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--accent-pink),var(--accent-purple));border-radius:4px;opacity:0.6}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--accent-pink),var(--accent-cyan))}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-primary);color:var(--text-primary);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* playful floating bg dots */
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 15% 25%,rgba(255,77,133,0.08) 0,transparent 50%),
                   radial-gradient(circle at 85% 75%,rgba(0,188,212,0.07) 0,transparent 50%),
                   radial-gradient(circle at 50% 50%,rgba(155,89,182,0.05) 0,transparent 50%)}

/* sidebar */
.sidebar{width:230px;background:linear-gradient(180deg,var(--bg-secondary) 0%,#e8e0ff 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:1}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border);font-size:14px;color:var(--text-muted)}
.logo{padding:24px 20px 18px;font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--accent-pink),var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.3px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo::before{content:'🪄';font-size:18px;-webkit-text-fill-color:initial;color:var(--accent-pink);animation:wiggle 3s ease-in-out infinite}
.logo span{font-weight:400;color:var(--text-muted);font-size:14px;margin-left:auto;-webkit-text-fill-color:initial;color:var(--text-muted)}
.nav{padding:16px 10px;flex:1}
.nav-item{padding:12px 14px;margin-bottom:4px;cursor:pointer;color:var(--text-secondary);font-size:15px;font-weight:500;border-radius:var(--radius-md);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;gap:10px}
.nav-item:hover{background:var(--bg-card);color:var(--text-primary);transform:translateX(4px) scale(1.02)}
.nav-item.active{background:linear-gradient(135deg,var(--accent-pink-glow),var(--accent-cyan-glow));color:var(--accent-cyan);font-weight:600;box-shadow:inset 3px 0 0 var(--accent-pink);transform:scale(1.03)}
.nav-item .nav-icon{width:20px;font-size:14px;text-align:center}

/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.topbar{padding:14px 24px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--text-primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.filters{display:flex;gap:6px}
.tag{padding:6px 16px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.tag:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);transform:translateY(-2px)}
.tag.active{background:linear-gradient(135deg,var(--accent-pink),var(--accent-purple));color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(255,77,133,0.2)}

/* stock list */
.content{flex:1;display:flex;overflow:hidden}
.stock-list{width:380px;border-right:1px solid var(--border);overflow-y:auto;padding:10px}
.stock-card{padding:13px 14px;border-radius:var(--radius-md);margin-bottom:8px;cursor:pointer;border:2px solid transparent;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.stock-card:hover,.stock-card.selected{background:var(--bg-card);border-color:var(--accent-cyan);transform:translateX(6px) scale(1.01);box-shadow:0 8px 25px rgba(0,188,212,0.08)}
.stock-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.stock-name{font-weight:600;font-size:15px}
.stock-meta{display:flex;gap:12px;font-size:14px;color:var(--text-secondary)}
.score-badge{padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:0.3px;transition:all 0.2s}
.score-a{background:linear-gradient(135deg,rgba(125,223,125,0.2),rgba(125,223,125,0.05));color:var(--accent-green);border:1px solid rgba(125,223,125,0.3)}
.score-b{background:linear-gradient(135deg,rgba(255,217,61,0.2),rgba(255,217,61,0.05));color:var(--accent-yellow);border:1px solid rgba(255,217,61,0.3)}
.score-c{background:linear-gradient(135deg,rgba(112,103,160,0.3),rgba(112,103,160,0.1));color:var(--text-muted);border:1px solid rgba(112,103,160,0.3)}
.score-badge:hover{transform:scale(1.15)}

/* detail panel */
.detail{flex:1;overflow-y:auto;padding:24px}
.detail-title{font-size:28px;font-weight:800;margin-bottom:2px;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--text-primary),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.detail-sub{color:var(--text-secondary);font-size:15px;margin-bottom:22px}
.score-section{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.score-card{background:var(--bg-card);border-radius:var(--radius-md);padding:18px;border:1px solid var(--border);position:relative;overflow:hidden}
.score-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent-pink),var(--accent-cyan),var(--accent-purple));animation:rainbow-slide 3s linear infinite;background-size:200% 100%}
.score-card h4{font-size:14px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.score-big{font-size:36px;font-weight:800;line-height:1.1}
.score-label{font-size:14px;color:var(--text-secondary);margin-top:6px}
.section{background:var(--bg-card);border-radius:var(--radius-md);padding:18px;margin-bottom:14px;border:1px solid var(--border);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.section:hover{border-color:var(--border-light);transform:translateY(-2px);box-shadow:0 8px 30px rgba(45,38,64,0.08)}
.section h3{font-size:15px;margin-bottom:14px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.metric-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(45,40,80,0.6);font-size:15px}
.metric-row:last-child{border-bottom:none}
.metric-label{color:var(--text-secondary)}
.metric-note{color:var(--text-muted);font-style:italic;font-size:13px}
.moat-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.moat-tag{padding:5px 13px;border-radius:20px;font-size:14px;font-weight:500;background:linear-gradient(135deg,rgba(77,217,246,0.1),rgba(255,107,157,0.1));color:var(--accent-cyan);border:1px solid rgba(77,217,246,0.2)}
.refresh-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:6px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.refresh-btn:hover{background:var(--bg-card-hover);color:var(--accent-cyan);border-color:var(--accent-cyan);transform:translateY(-1px) scale(1.03)}
.refresh-btn.refreshing{color:var(--accent-cyan);animation:spin 0.8s linear infinite}

/* dashboard row */
.dashboard-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 14px 0}
.dash-col{background:var(--bg-card);border-radius:var(--radius-md);padding:14px;border:1px solid var(--border);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.dash-col:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(45,38,64,0.1);border-color:var(--border-light)}
.dash-title{font-size:13px;color:var(--text-secondary);margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px}
.dash-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(45,40,80,0.5);font-size:14px;cursor:pointer;color:var(--text-primary);transition:all 0.15s cubic-bezier(0.34,1.56,0.64,1)}
.dash-item:last-child{border-bottom:none}
.dash-item:hover{color:var(--accent-cyan);padding-left:8px;transform:scale(1.02)}
.dash-rank{display:flex;align-items:center;gap:8px}
.rank-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent-pink-glow),var(--accent-cyan-glow));color:var(--accent-cyan);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.dash-item:hover .rank-num{transform:scale(1.2);background:linear-gradient(135deg,var(--accent-pink),var(--accent-cyan));color:#fff}
.portfolio-panel,.signals-panel,.data-panel{background:var(--bg-primary);min-height:100%;padding:24px}

/* watchlist stats */
.watchlist-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;margin-top:12px}
.watchlist-stat{background:var(--bg-card);border-radius:var(--radius-md);padding:14px;text-align:center;border:1px solid var(--border);position:relative;overflow:hidden;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.watchlist-stat:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(45,38,64,0.08)}
.watchlist-stat:nth-child(1)::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,var(--accent-cyan),var(--accent-pink));border-radius:0 0 3px 3px}
.watchlist-stat:nth-child(2)::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,var(--accent-purple),var(--accent-pink));border-radius:0 0 3px 3px}
.watchlist-stat:nth-child(3)::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,var(--accent-green),var(--accent-cyan));border-radius:0 0 3px 3px}
.watchlist-stat:nth-child(4)::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;background:linear-gradient(90deg,var(--accent-orange),var(--accent-red));border-radius:0 0 3px 3px}
.watchlist-stat-num{font-size:28px;font-weight:800;color:var(--text-primary);line-height:1.2}
.watchlist-stat:nth-child(1) .watchlist-stat-num{color:var(--accent-cyan)}
.watchlist-stat:nth-child(2) .watchlist-stat-num{color:var(--accent-purple)}
.watchlist-stat:nth-child(3) .watchlist-stat-num{color:var(--accent-green)}
.watchlist-stat:nth-child(4) .watchlist-stat-num{color:var(--accent-red)}
.watchlist-stat-label{font-size:13px;color:var(--text-secondary);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.4px}

/* progress bar */
.progress-bar-wrap{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-card);border-radius:var(--radius-md);margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(45,38,64,0.04)}
.progress-bar-inner{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative}
.progress-bar-inner::before{content:'';position:absolute;left:0;top:0;height:100%;width:40%;background:linear-gradient(90deg,var(--accent-pink),var(--accent-cyan),var(--accent-purple));border-radius:3px;animation:progress-slide 1s ease-in-out infinite;background-size:200% 100%}
@keyframes progress-slide{0%{left:-40%}100%{left:110%}}
.progress-text{font-size:14px;background:linear-gradient(135deg,var(--accent-pink),var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:600;white-space:nowrap}

/* watchlist cards */
.watchlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.watchlist-card{background:var(--bg-card);border-radius:var(--radius-lg);padding:16px;cursor:pointer;border:1px solid var(--border);transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);position:relative}
.watchlist-card:hover,.watchlist-card.selected{background:var(--bg-card-hover);border-color:var(--accent-pink);transform:translateY(-6px) scale(1.02);box-shadow:0 16px 40px rgba(255,77,133,0.12)}
.wl-badge{position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.wl-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.wl-name{font-weight:600;font-size:15px;margin-bottom:2px}
.wl-meta{font-size:14px;color:var(--text-secondary)}
.wl-star{font-size:18px;cursor:pointer;color:var(--text-muted);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.wl-star.active,.wl-star:hover{color:var(--accent-yellow);text-shadow:0 0 12px rgba(255,217,61,0.4);transform:scale(1.2) rotate(18deg)}
.wl-star-inline{font-size:14px;cursor:pointer;color:var(--text-muted);margin:0 4px;transition:all 0.2s}
.wl-star-inline.active{color:var(--accent-yellow)}
.wl-star-inline:hover{color:var(--accent-yellow);transform:scale(1.15)}
.wl-price{font-size:22px;font-weight:700;margin-bottom:10px;letter-spacing:-0.3px}
.wl-footer{display:flex;justify-content:space-between;align-items:center;gap:6px}
.wl-roic{font-size:14px;color:var(--text-muted)}
.wl-discount{font-size:14px;font-weight:600}

/* portfolio */
.portfolio-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.portfolio-stat{background:var(--bg-card);border-radius:var(--radius-lg);padding:18px;border:1px solid var(--border);position:relative;overflow:hidden;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.portfolio-stat:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(45,38,64,0.1)}
.portfolio-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.portfolio-stat:nth-child(1)::before{background:linear-gradient(90deg,var(--accent-cyan),var(--accent-pink))}
.portfolio-stat:nth-child(2)::before{background:linear-gradient(90deg,var(--accent-purple),var(--accent-pink))}
.portfolio-stat:nth-child(3)::before{background:linear-gradient(90deg,var(--accent-green),var(--accent-cyan))}
.portfolio-stat:nth-child(4)::before{background:linear-gradient(90deg,var(--accent-yellow),var(--accent-orange))}
.portfolio-stat-label{font-size:13px;color:var(--text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.portfolio-stat-value{font-size:28px;font-weight:800;line-height:1.1}
.portfolio-stat-sub{font-size:14px;color:var(--text-muted);margin-top:4px}
.portfolio-table{width:100%;border-collapse:collapse}
.portfolio-table th{padding:12px 14px;text-align:left;font-size:14px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
.portfolio-table td{padding:14px 14px;font-size:15px;border-bottom:1px solid rgba(45,40,80,0.5)}
.portfolio-table tr:hover td{background:var(--bg-card-hover)}
.portfolio-table .num{text-align:right;font-variant-numeric:tabular-nums}
.portfolio-gain{color:var(--accent-green);font-weight:600}
.portfolio-loss{color:var(--accent-red);font-weight:600}
.portfolio-name{font-weight:600}
.portfolio-ticker{font-size:14px;color:var(--text-muted)}
.portfolio-add-btn{display:flex;align-items:center;gap:6px;padding:10px 22px;background:linear-gradient(135deg,var(--accent-pink),var(--accent-purple));color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 4px 15px rgba(255,77,133,0.15)}
.portfolio-add-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 25px rgba(255,77,133,0.25)}
.portfolio-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.portfolio-title{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent-pink),var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.portfolio-empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.portfolio-empty-icon{font-size:48px;opacity:0.3;margin-bottom:16px}
.portfolio-empty-title{font-size:18px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
.portfolio-empty-hint{font-size:15px}
.portfolio-del{color:var(--text-muted);cursor:pointer;font-size:14px;opacity:0;transition:opacity 0.15s;padding:4px 8px;border-radius:4px}
.portfolio-table tr:hover .portfolio-del{opacity:1}
.portfolio-del:hover{color:var(--accent-red);background:rgba(255,107,107,0.15);transform:scale(1.05)}
.portfolio-input-wrap{display:flex;flex-direction:column;gap:8px;padding:16px 20px;border-top:1px solid var(--border)}
.portfolio-input-label{font-size:14px;color:var(--text-secondary);font-weight:500}
.portfolio-input-row{display:flex;gap:8px}
.portfolio-input{background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:15px;outline:none;flex:1;transition:border-color 0.15s}
.portfolio-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(77,217,246,0.1)}
.portfolio-ok-btn{padding:10px 22px;background:linear-gradient(135deg,var(--accent-pink),var(--accent-purple));color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.portfolio-ok-btn:not([disabled]):hover{transform:scale(1.05);box-shadow:0 4px 15px rgba(255,77,133,0.2)}
.portfolio-cancel-btn{padding:10px 18px;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;cursor:pointer;transition:all 0.15s}
.portfolio-cancel-btn:hover{background:var(--bg-card-hover);color:var(--text-primary)}

/* search modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(45,38,64,0.5);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);width:420px;max-height:520px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 48px rgba(45,38,64,0.15);animation:modal-pop 0.25s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes modal-pop{0%{opacity:0;transform:scale(0.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}
.modal-close{font-size:24px;cursor:pointer;color:var(--text-muted);line-height:1;transition:all 0.15s}
.modal-close:hover{color:var(--accent-pink);transform:rotate(90deg)}
.modal-search{padding:14px 20px;border-bottom:1px solid var(--border)}
.modal-input{width:100%;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text-primary);font-size:15px;outline:none;transition:all 0.15s}
.modal-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 0 3px rgba(77,217,246,0.1)}
.modal-input::placeholder{color:var(--text-muted)}
.modal-results{max-height:320px;overflow-y:auto}
.modal-result-item{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:15px;border-bottom:1px solid rgba(45,40,80,0.5);transition:all 0.12s}
.modal-result-item:hover{background:var(--bg-card);padding-left:24px}
.modal-result-name{font-weight:500}
.modal-result-ticker{color:var(--text-muted);font-size:14px}
.modal-no-result{padding:24px;text-align:center;color:var(--text-muted);font-size:15px}
.watchlist-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.watchlist-title{font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-add{background:linear-gradient(135deg,var(--accent-pink),var(--accent-purple));color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 4px 12px rgba(255,77,133,0.15)}
.btn-add:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px rgba(255,77,133,0.25)}

/* empty */
.wl-empty{padding:48px 20px;text-align:center}
.wl-empty-icon{font-size:48px;color:var(--border-light);margin-bottom:14px;line-height:1}
.wl-empty-text{font-size:17px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.wl-empty-hint{font-size:14px;color:var(--text-muted)}

/* modal market tabs */
.modal-market-tabs{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border)}
.market-tab{padding:6px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border);transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.market-tab:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);transform:translateY(-1px)}
.market-tab.active{background:linear-gradient(135deg,var(--accent-pink),var(--accent-purple));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,77,133,0.15)}

/* chart */
.chart-container{background:var(--bg-card);border-radius:var(--radius-md);padding:18px;margin-bottom:16px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(45,38,64,0.04)}

/* keyframes */
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes rainbow-slide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
